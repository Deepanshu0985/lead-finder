name: Reddit lead finder

# Only a timer. It calls your Vercel app, which does the work.
# All real keys (Mistral, Telegram, Supabase, Reddit) live in Vercel only.
# GitHub needs just two things:
#   Secret   CRON_SECRET  → same value as CRON_SECRET in Vercel
#   Variable APP_URL      → e.g. https://smartvyn-leads.vercel.app (no trailing slash)

on:
  schedule:
    # Every 3 hours (UTC). IST: 05:30, 08:30, 11:30, 14:30, 17:30, 20:30, 23:30, 02:30
    - cron: "0 */3 * * *"
  workflow_dispatch: {} # "Run workflow" button for manual runs

concurrency:
  group: lead-finder
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check setup
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "::warning::Not set up yet: add secret CRON_SECRET and variable APP_URL. Skipping."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Run lead finder
        if: env.SKIP != '1'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          code=$(curl -sS -o result.json -w "%{http_code}" --max-time 330 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/run")
          cat result.json; echo
          if [ "$code" != "200" ]; then echo "::error::Run failed with HTTP $code"; exit 1; fi
