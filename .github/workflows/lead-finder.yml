name: Reddit lead finder

on:
  schedule:
    # Every 3 hours (UTC). GitHub may delay scheduled runs by a few minutes; that's fine.
    # IST times: 05:30, 08:30, 11:30, 14:30, 17:30, 20:30, 23:30, 02:30
    - cron: "0 */3 * * *"
  workflow_dispatch: {} # "Run workflow" button for manual runs

concurrency:
  group: lead-finder
  cancel-in-progress: false # never run two at once

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Find leads
        run: npm run run:once
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          REDDIT_MODE: ${{ vars.REDDIT_MODE || 'oauth' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
